name: Visual Regression

# The full OSS loop: every PR gets a diff comment + commit status from
# testivai/testivai-oss@v1; a collaborator approves changed baselines by
# commenting `/testivai approve [name|--all]` and they're committed back.
# On main, snapshots that have no baseline yet are adopted automatically.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  issue_comment:
    types: [created]

# Concurrency: PR runs cancel older runs of the same PR. A `/testivai`
# comment queues behind earlier ones on the same PR (one approve at a time);
# any other comment gets its own group, so chatter can never evict a queued
# approve. Runs on main never cancel each other (or a baseline adoption).
concurrency:
  group: visual-${{ github.event_name }}-${{ github.event_name == 'issue_comment' && (startsWith(github.event.comment.body, '/testivai') && format('pr-{0}', github.event.issue.number) || format('c-{0}', github.event.comment.id)) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  visual:
    name: Visual Regression
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write       # adopt step pushes new baselines to main
      pull-requests: write  # diff comment
      statuses: write       # commit status
      actions: write        # adopt step re-deploys the /main/ report
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '24', cache: 'npm' }
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm test
      - name: Post diff results
        uses: testivai/testivai-oss@v1
        if: always()
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          report-dir: visual-report
      - name: Adopt baselines for new snapshots
        # On main only: a snapshot with no baseline yet gets this run's CI
        # capture as its baseline, so a merge never leaves a page uncompared.
        # Changed snapshots are never touched; they still need a human
        # `/testivai approve` on a PR. Logic and guard: scripts/adopt-new-baselines.mjs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/adopt-new-baselines.mjs visual-report/results.json
          if [ ! -d .testivai/baselines ]; then exit 0; fi
          git add .testivai/baselines
          if git diff --cached --quiet; then exit 0; fi
          names=$(git -c core.quotePath=false diff --cached --name-only | sed -n 's#^\.testivai/baselines/\([^/]*\)/.*#\1#p' | sort -u | paste -sd, - | sed 's/,/, /g')
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "chore(visual): adopt CI baselines for new snapshots: $names" \
            -m "Captured by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. These snapshots had no baseline; existing baselines were not touched."
          if git push origin HEAD:main; then
            # A push made with GITHUB_TOKEN starts no workflow, so ask for the
            # /main/ report to be rebuilt against the new baselines.
            gh workflow run deploy-report.yml --ref main || echo "::warning::Baselines pushed, but the report re-deploy could not be started; it updates on the next push to main."
          else
            echo "::warning::main moved on before the push; the next run on main adopts these snapshots instead."
          fi
  demo:
    name: Demo verdicts
    # The three demo changes must still produce three different verdicts,
    # in results.json and over MCP; this is what the live report shows.
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '24', cache: 'npm' }
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run test:demo
      - run: npm run test:scripts
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: demo-report
          path: demo-report

  agent-review:
    name: Agent review (Claude + TestivAI MCP)
    # Claude reads the report through @testivai/mcp, compares it with the PR's
    # diff, and the workflow posts one comment (updated on each push). The
    # agent gets read-only tools: approving stays a human /testivai approve.
    # Same-repo PRs only: fork PRs get no secrets. Logic: scripts/testivai-review.cjs
    needs: visual
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    env:
      HAS_CLAUDE_AUTH: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '24', cache: 'npm' }
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: testivai-visual-report
          path: visual-report
      - name: Anything to review?
        id: prep
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const review = require('./scripts/testivai-review.cjs');
            const results = JSON.parse(fs.readFileSync('visual-report/results.json', 'utf8'));
            const needed = review.needsReview(results);
            core.setOutput('needed', String(needed));
            if (!needed) return;
            const { data: diff } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: context.issue.number,
              mediaType: { format: 'diff' },
            });
            fs.writeFileSync('pr.diff', diff);
            core.setOutput('prompt', review.buildPrompt({ repo: `${context.repo.owner}/${context.repo.repo}`, pr: context.issue.number }));
            core.setOutput('claude_args', review.claudeArgs());
      - name: No Claude credentials
        if: steps.prep.outputs.needed == 'true' && env.HAS_CLAUDE_AUTH != 'true'
        run: echo "::notice::Visual changes found, but neither ANTHROPIC_API_KEY nor CLAUDE_CODE_OAUTH_TOKEN is set as a repository secret, so the agent review was skipped."
      - name: Claude reviews the visual changes
        id: claude
        if: steps.prep.outputs.needed == 'true' && env.HAS_CLAUDE_AUTH == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: ${{ steps.prep.outputs.prompt }}
          claude_args: ${{ steps.prep.outputs.claude_args }}
      - name: Post the review
        if: steps.claude.outcome == 'success'
        uses: actions/github-script@v9
        env:
          REVIEW: ${{ steps.claude.outputs.structured_output }}
        with:
          script: |
            const fs = require('fs');
            const review = require('./scripts/testivai-review.cjs');
            const results = JSON.parse(fs.readFileSync('visual-report/results.json', 'utf8'));
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = review.renderComment(results, JSON.parse(process.env.REVIEW), { runUrl });
            await review.syncComment({ github, context, body });
      - name: Clear a stale review
        if: steps.prep.outputs.needed == 'false'
        uses: actions/github-script@v9
        with:
          script: |
            const review = require('./scripts/testivai-review.cjs');
            await review.syncComment({ github, context, body: review.renderNothingToReview(), onlyIfExists: true });

  approve:
    name: Approve Baselines
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/testivai')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: testivai/testivai-oss/approve@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          workflow: visual.yml
