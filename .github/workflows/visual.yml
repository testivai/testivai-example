name: Visual Regression

# The full OSS loop: every PR gets a diff comment, a commit status and a
# `TestivAI / visual` check from testivai/testivai-oss@v1. A changed snapshot
# fails that check (require it in a branch rule to block the merge) until a
# collaborator comments `/testivai approve [name|--all]`; the baselines are
# committed back and the check runs again on that commit.
# On main, snapshots that have no baseline yet are adopted automatically.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  issue_comment:
    types: [created]
  workflow_dispatch:   # the approve job re-runs the visual check on a PR branch

# Concurrency: PR runs cancel older runs of the same PR. A `/testivai`
# comment queues behind earlier ones on the same PR (one approve at a time);
# any other comment gets its own group, so chatter can never evict a queued
# approve. Runs on main never cancel each other (or a baseline adoption).
concurrency:
  group: visual-${{ github.event_name }}-${{ github.event_name == 'issue_comment' && (startsWith(github.event.comment.body, '/testivai') && format('pr-{0}', github.event.issue.number) || format('c-{0}', github.event.comment.id)) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  visual:
    name: Visual Regression
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write       # adopt step pushes new baselines to main
      pull-requests: write  # diff comment
      statuses: write       # commit status
      checks: write         # neutral check run when snapshots need review
      actions: write        # adopt step re-deploys the /main/ report
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '24', cache: 'npm' }
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm test
      - name: Post diff results
        uses: testivai/testivai-oss@v1
        if: always()
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          report-dir: visual-report
          # Fail the check on a changed snapshot, except on main (new
          # baselines are adopted there; changes are approved on the PR).
          fail-on-diff: ${{ github.ref != 'refs/heads/main' }}
      - name: Adopt baselines for new snapshots
        # On main only: a snapshot with no baseline yet gets this run's CI
        # capture as its baseline, so a merge never leaves a page uncompared.
        # Changed snapshots are never touched; they still need a human
        # `/testivai approve` on a PR. Logic and guard: scripts/adopt-new-baselines.mjs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/adopt-new-baselines.mjs visual-report/results.json
          if [ ! -d .testivai/baselines ]; then exit 0; fi
          git add .testivai/baselines
          if git diff --cached --quiet; then exit 0; fi
          names=$(git -c core.quotePath=false diff --cached --name-only | sed -n 's#^\.testivai/baselines/\([^/]*\)/.*#\1#p' | sort -u | paste -sd, - | sed 's/,/, /g')
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "chore(visual): adopt CI baselines for new snapshots: $names" \
            -m "Captured by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. These snapshots had no baseline; existing baselines were not touched."
          if git push origin HEAD:main; then
            # A push made with GITHUB_TOKEN starts no workflow, so ask for the
            # /main/ report to be rebuilt against the new baselines.
            gh workflow run deploy-report.yml --ref main || echo "::warning::Baselines pushed, but the report re-deploy could not be started; it updates on the next push to main."
          else
            echo "::warning::main moved on before the push; the next run on main adopts these snapshots instead."
          fi
  demo:
    name: Demo verdicts
    # The three demo changes must still produce three different verdicts,
    # in results.json and over MCP; this is what the live report shows.
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '24', cache: 'npm' }
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run test:demo
      - run: npm run test:scripts
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: demo-report
          path: demo-report

  agent-review:
    name: Agent review (Claude + TestivAI MCP)
    # testivai/testivai-oss/review@v1: Claude reads the report through
    # @testivai/mcp, the images and the PR's diff, and posts one comment
    # (updated on each push) triaging each changed or new snapshot as a glitch,
    # an intended change, a bug or a possible bug. Advisory, read-only tools:
    # approving stays a human /testivai approve. It skips, using no tokens, when
    # no snapshot is changed or new (missing baselines are not triaged) or no
    # Claude secret is set; fork PRs get no secrets.
    needs: visual
    # !cancelled(): a changed snapshot fails the visual job, which is exactly
    # when the review is useful.
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    # A newer push cancels the triage of an older one, and the tokens with it.
    concurrency:
      group: ai-triage-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read         # check out the code Claude may read
      pull-requests: write   # read the PR's diff, post the comment
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        # No artifact when the visual job failed before the tests ran: the
        # review then skips with a warning instead of failing this job.
        continue-on-error: true
        with:
          name: testivai-visual-report
          path: visual-report   # the reportDir in .testivai/config.json, where the action reads it
      - uses: testivai/testivai-oss/review@v1
        with:
          # One is enough; enabled: false turns the review off.
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  approve:
    name: Approve Baselines
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/testivai')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write       # commit the approved baselines to the PR branch
      pull-requests: write  # reply on the PR
      actions: write        # read the PR's visual run and artifact; start the re-run
    env:
      HAS_APPROVE_TOKEN: ${{ secrets.TESTIVAI_APPROVE_TOKEN != '' }}
    steps:
      - uses: testivai/testivai-oss/approve@v1
        with:
          # A push made with GITHUB_TOKEN starts no workflow. With a
          # TESTIVAI_APPROVE_TOKEN secret (see README) the approve push re-runs
          # the whole PR workflow; without it, the next step re-runs the check.
          github-token: ${{ secrets.TESTIVAI_APPROVE_TOKEN || secrets.GITHUB_TOKEN }}
          workflow: visual.yml
      - name: Re-run the visual check on the approve commit
        # Starts visual.yml on the PR branch, which posts `TestivAI / visual`
        # on the new head, so a required check is not left waiting. Inline on
        # purpose: the workspace now holds the PR branch, and nothing from it
        # (or from the comment) may run with this job's token.
        if: env.HAS_APPROVE_TOKEN != 'true' && startsWith(github.event.comment.body, '/testivai approve')
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number }}
          ACTOR: ${{ github.event.comment.user.login }}
        run: |
          perm=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$ACTOR/permission" --jq .permission 2>/dev/null) || perm=none
          case "$perm" in
            admin|maintain|write) ;;
            *) echo "@$ACTOR has no write access; nothing to re-run."; exit 0 ;;
          esac
          if [ "$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json isCrossRepository --jq .isCrossRepository)" != false ]; then
            echo "::warning::PR #$PR comes from a fork; push a commit to its branch to re-run the visual check."
            exit 0
          fi
          branch=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefName --jq .headRefName)
          gh workflow run visual.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
          echo "Started visual.yml on $branch; its check lands on the approve commit."
