name: Deploy Live Report

# Publishes TestivAI reports to GitHub Pages with testivai/testivai-oss/publish,
# after every Visual Regression run:
#   /         every published report: main and each open pull request
#   /main/    the latest run on main, against the committed baselines
#   /pr/<n>/  each open pull request's last 3 runs (forks included); the
#             pull request's TestivAI comment links its run's report
#   /demo/    the demo: three deliberate changes (layout shift, style-only,
#             structural), each diffed against the untouched site
#
# The whole site is rebuilt every time, so a closed pull request's reports go
# with the next publish. The publish action never checks out or runs pull
# request code; this job checks out main only, to build the demo.

on:
  workflow_run:
    workflows: [Visual Regression]
    types: [completed]
  pull_request_target:
    types: [closed]   # takes a closed pull request's reports off the site
  workflow_dispatch:

# Each publish builds the whole site: a newer one replaces a running one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    # A `/testivai` comment run has no report of its own: skip the publish.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event != 'issue_comment'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read          # runs and their report artifacts
      pages: write           # deploy
      id-token: write        # deploy
      pull-requests: write   # the report links in comments
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page-url }}
    steps:
      # main (the base branch on pull_request_target), never the pull request.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '24', cache: 'npm' }
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      # Builds demo-report/ and fails the publish if the three verdicts drift.
      - run: npm run test:demo
      - id: publish
        uses: testivai/testivai-oss/publish@v1
        with:
          public-reports: ${{ vars.TESTIVAI_PUBLIC_REPORTS }}
          include-dir: demo-report
          include-name: demo
