name: Sharding Experiment

# End-to-end validation of the capture-only sharded flow, against packages
# built from source (pre-publish). Self-contained: baselines are seeded inside
# the run, so nothing is committed.
#
#   seed    → capture all 8 snapshots unsharded, approve, publish baselines
#   shard   → 8 real machines, capture-only (no compare, no report)
#   central → merge-captures + one report; asserts exit 0
#   regress → same flow with a real CSS change; asserts exit 1

on:
  push:
    branches: [experiment/sharding]
  workflow_dispatch:

permissions:
  contents: read

env:
  OSS_REF: feat/sharded-capture-only

jobs:
  build-sdk:
    name: Build SDK from source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: mcbuddy/testivai-oss
          ref: ${{ env.OSS_REF }}
          path: oss
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: oss/package.json
      - run: pnpm install --frozen-lockfile
        working-directory: oss
      - run: pnpm build
        working-directory: oss
      - name: Stage the built output with a predictable layout
        run: |
          mkdir -p sdk-out/witness sdk-out/playwright
          cp -R oss/packages/witness/dist    sdk-out/witness/dist
          cp -R oss/packages/playwright/dist sdk-out/playwright/dist
      - name: Publish the built output for the other jobs
        uses: actions/upload-artifact@v4
        with:
          name: sdk-dist
          path: sdk-out/
          retention-days: 1

  seed:
    name: Seed baselines (unsharded)
    needs: build-sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { name: sdk-dist, path: sdk }
      - name: Overlay the built SDK
        run: |
          rm -rf node_modules/@testivai/witness/dist node_modules/@testivai/witness-playwright/dist
          cp -R sdk/witness/dist    node_modules/@testivai/witness/dist
          cp -R sdk/playwright/dist node_modules/@testivai/witness-playwright/dist
          # upload-artifact does not preserve the executable bit
          chmod +x node_modules/@testivai/witness/dist/bin/*.js
          chmod +x node_modules/.bin/testivai 2>/dev/null || true
      - name: Isolate the experiment from the repo's own committed baselines
        run: rm -rf .testivai/baselines
      - run: npx playwright install chromium --with-deps
      - run: npx playwright test
      - run: npx testivai approve --all
      - uses: actions/upload-artifact@v4
        with: { name: seeded-baselines, path: .testivai/baselines/, retention-days: 1 }

  shard:
    name: "shard ${{ matrix.shard }}/8"
    needs: seed
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { name: sdk-dist, path: sdk }
      - name: Overlay the built SDK
        run: |
          rm -rf node_modules/@testivai/witness/dist node_modules/@testivai/witness-playwright/dist
          cp -R sdk/witness/dist    node_modules/@testivai/witness/dist
          cp -R sdk/playwright/dist node_modules/@testivai/witness-playwright/dist
          # upload-artifact does not preserve the executable bit
          chmod +x node_modules/@testivai/witness/dist/bin/*.js
          chmod +x node_modules/.bin/testivai 2>/dev/null || true
      - run: npx playwright install chromium --with-deps

      # Deliberately NO baselines and NO report step — a shard should need
      # neither. If the reporter tried to compare here, it would fail.
      - name: Run this shard (capture-only expected)
        run: npx playwright test --shard=${{ matrix.shard }}/8 2>&1 | tee shard.log

      - name: Assert the shard captured but did not compare
        run: |
          grep -q "comparison skipped" shard.log || { echo "::error::shard did not enter capture-only mode"; exit 1; }
          if [ -f visual-report/index.html ]; then echo "::error::shard generated a report"; exit 1; fi
          echo "shard ${{ matrix.shard }}/8 captured: $(ls .testivai/temp | tr '\n' ' ')" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: captures-${{ matrix.shard }}
          path: .testivai/temp/
          if-no-files-found: ignore
          retention-days: 1

  central:
    name: Merge + compare once (expect exit 0)
    needs: shard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { name: sdk-dist, path: sdk }
      - name: Overlay the built SDK
        run: |
          rm -rf node_modules/@testivai/witness/dist node_modules/@testivai/witness-playwright/dist
          cp -R sdk/witness/dist    node_modules/@testivai/witness/dist
          cp -R sdk/playwright/dist node_modules/@testivai/witness-playwright/dist
          # upload-artifact does not preserve the executable bit
          chmod +x node_modules/@testivai/witness/dist/bin/*.js
          chmod +x node_modules/.bin/testivai 2>/dev/null || true
      - name: Isolate the experiment from the repo's own committed baselines
        run: rm -rf .testivai/baselines
      - uses: actions/download-artifact@v4
        with: { name: seeded-baselines, path: .testivai/baselines/ }
      - uses: actions/download-artifact@v4
        with: { pattern: captures-*, path: collected/ }

      - name: merge-captures
        run: npx testivai merge-captures collected/ | tee merge.log

      - name: Compare once — must exit 0 with zero missing
        run: |
          set +e
          npx testivai report --fail-on-diff --json > central.json
          CODE=$?
          set -e
          echo "exit code: $CODE"
          python3 scripts/assert-central.py "$CODE"
          echo "### Central compare: exit 0, 8/8 passed, 0 missing ✅" >> "$GITHUB_STEP_SUMMARY"

  regress:
    name: Real regression must still fail (expect exit 1)
    needs: shard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { name: sdk-dist, path: sdk }
      - name: Overlay the built SDK
        run: |
          rm -rf node_modules/@testivai/witness/dist node_modules/@testivai/witness-playwright/dist
          cp -R sdk/witness/dist    node_modules/@testivai/witness/dist
          cp -R sdk/playwright/dist node_modules/@testivai/witness-playwright/dist
          # upload-artifact does not preserve the executable bit
          chmod +x node_modules/@testivai/witness/dist/bin/*.js
          chmod +x node_modules/.bin/testivai 2>/dev/null || true
      - name: Isolate the experiment from the repo's own committed baselines
        run: rm -rf .testivai/baselines
      - uses: actions/download-artifact@v4
        with: { name: seeded-baselines, path: .testivai/baselines/ }
      - run: npx playwright install chromium --with-deps

      - name: Introduce a real style change
        run: |
          sed -i 's/--brand:#0e7490/--brand:#b91c1c/' site/index.html
          grep -q "b91c1c" site/index.html

      - name: Re-run all 8 shards locally, then merge and compare
        run: |
          mkdir -p collected
          for i in 1 2 3 4 5 6 7 8; do
            rm -rf .testivai/temp
            npx playwright test --shard=$i/8 >/dev/null 2>&1
            mkdir -p "collected/captures-$i"
            cp -R .testivai/temp/. "collected/captures-$i/" 2>/dev/null || true
          done
          rm -rf .testivai/temp
          npx testivai merge-captures collected/ >/dev/null
          set +e
          npx testivai report --fail-on-diff --json > regress.json
          CODE=$?
          set -e
          echo "exit code: $CODE"
          python3 scripts/assert-regression.py "$CODE"
          echo "### Regression through sharded path: exit 1, 8 changed, styleCheck mismatch ✅" >> "$GITHUB_STEP_SUMMARY"
